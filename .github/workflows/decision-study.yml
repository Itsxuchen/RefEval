name: Decision-study numerical reproduction
on:
  push:
    paths:
      - 'artifacts/studies/all-pass-decisions/**'
      - '.github/workflows/decision-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: artifacts/studies/all-pass-decisions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sha256sum --check --quiet SHA256SUMS.txt
      - run: python -m pip install -r requirements.txt
      - run: sh reproduce.sh
      - run: git diff --exit-code -- 'generated/*.tex'
