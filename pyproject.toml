[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-label-value"
version = "0.3.0"
description = "Offline reproduction of estimation, certification and verdict repair in conjunctive evaluations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy==2.5.2", "scipy==1.18.1", "pandas==2.2.3", "matplotlib==3.11.1"]

[project.optional-dependencies]
external = ["pyarrow==19.0.1", "tiktoken==0.12.0"]
scoring = ["openai==3.6.0"]

[project.urls]
Repository = "https://github.com/Itsxuchen/RefEval"
Issues = "https://github.com/Itsxuchen/RefEval/issues"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

